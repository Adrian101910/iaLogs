<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/site/public
    <Directory /var/www/site/public>
        AllowOverride All
        Require all granted
    </Directory>
    <Directory /var/www/site/ialogs-private>
        Require all denied
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
